<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сценарии звонка</title>
<!--
  Оболочка прототипа: окно звонка слева, общая панель справа.
  Шаблон; данные подставляет `storybook/gen_scenarios.py`, результат —
  `generated/shell/index.html`, адрес `/scenarios/index.html`.

  Панель — сверху вниз: устройство, заполнение, дерево прототипа
  (пользователь, сценарий, условия), шаги. Правила — `panel-rules.md`.
-->
<style>
/* Оболочка сценариев: стили. Шаблон — shell.html. */
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --faint: #94a3b8;
  --line: #e2e8f0;
  --accent: #0f172a;
  --now: #2563eb;
  /* панель сценария — по макету владельца */
  --pick: #f47a3c;
  --pick-ring: #f9b995;
  --off: #8e98ad;
  --off-ring: #c9ced8;
  --well: #f1f2f4;
  --pill: #1d2433;
  --panel-width: 300px;
  --panel-gap: 20px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  grid-template-columns: max-content var(--panel-width);
  gap: var(--panel-gap);
  height: 100dvh;
  overflow: hidden;
  font: 13px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--bg);
}

/* Размер продукта выбран чипом; рамка вписывает его в доступное место. */
.sh-stage { min-width: 0; min-height: 0; }
.sh-frame { position: relative; overflow: hidden; box-shadow: 0 2px 12px rgba(15, 23, 42, .18); background: #202327; }
.sh-frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
.sh-frame iframe.sh-preparing-frame { opacity: 0; pointer-events: none; }
.sh-frame[aria-busy='true'] > #window { pointer-events: none; }
.sh-transition-error { position: absolute; z-index: 1; left: 12px; right: 12px; bottom: 12px; padding: 10px; color: var(--ink); background: var(--panel); }
.sh-transition-error button { color: var(--now); font: inherit; cursor: pointer; }

/* панель */
.sh-panel { position: static; display: flex; flex-direction: column; width: var(--panel-width); height: 100%; max-width: none; max-height: none; min-height: 0; margin: 0; padding: 0; color: var(--ink); font: inherit; background: var(--panel); border: 0; border-left: 1px solid var(--line); }
.sh-panel-slim { overflow-y: auto; }
.sh-size-chip { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: var(--well); color: var(--off); font: inherit; cursor: pointer; }
.sh-size-chip-custom { width: auto; padding: 0 10px; }
.sh-size-chip:hover { color: var(--ink); }
.sh-size-chip[aria-pressed='true'] { background: var(--pill); color: var(--panel); }
.sh-size-chip:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.sh-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.sh-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.sh-badge { padding: 1px 7px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; }
.sh-story { margin: 6px 0 0; color: var(--muted); font-size: 12px; }

/* фильтры сценария: сценарий → доступ вызова → шаг */
.sh-device { padding: 8px 7px 10px; }
.sh-device-row { display: flex; align-items: center; gap: 6px; }
.sh-device-size, .sh-custom-size { height: 18px; margin: 8px 0 0 6px; color: var(--off); font-size: 12px; line-height: 18px; }
.sh-custom-size { display: flex; align-items: center; gap: 2px; }
.sh-size-input { width: 5ch; height: 18px; padding: 0; border: 0; border-bottom: 1px solid var(--off-ring); border-radius: 0; background: transparent; color: var(--ink); font: inherit; }
.sh-size-input::placeholder { color: var(--off); opacity: 1; }
.sh-size-input:focus-visible { outline: none; border-bottom-color: var(--pick); }
.sh-size-input[aria-invalid='true'] { border-color: var(--pick); }
.sh-size-error { margin: 6px 0 0 6px; color: var(--muted); font-size: 12px; }
.sh-filters { margin: 0 1px; padding-bottom: 6px; border-radius: 8px; background: var(--well); }
.sh-filter-title { margin: 0; padding: 8px 13px 5px; font-size: 14px; font-weight: 400; line-height: 17px; text-transform: uppercase; }
.sh-filter-list { margin: 0 6px; padding: 6px 10px; border-radius: 8px; background: var(--panel); }
.sh-radio { display: flex; align-items: center; gap: 6px; min-height: 24px; color: var(--off); font-size: 14px; cursor: pointer; }
.sh-radio:hover { color: var(--ink); }
.sh-radio input { flex-shrink: 0; width: 12px; height: 12px; margin: 0; border: 1px solid var(--off-ring); border-radius: 50%; background: var(--panel); appearance: none; cursor: pointer; }
.sh-radio input:checked { border: 2px solid var(--pick-ring); background: var(--pick); }
.sh-radio input:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.sh-radio:has(input:checked) { color: var(--ink); }
.sh-note { margin: 0; color: var(--off); font-size: 13px; line-height: 18px; }
.sh-note + .sh-note { margin-top: 6px; }
/* выпадающий список уровня: стрелка — рамкой псевдоэлемента, цвет из токена */
.sh-select { position: relative; display: block; }
.sh-select select { width: 100%; height: 28px; margin: 2px 0; padding: 0 26px 0 8px; border: 1px solid var(--off-ring); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; appearance: none; cursor: pointer; }
.sh-select select:hover { border-color: var(--off); }
.sh-select select:focus-visible { outline: none; border-color: var(--ink); }
.sh-select::after { content: ''; position: absolute; top: 50%; right: 11px; width: 6px; height: 6px; border: solid var(--off); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }

</style>
</head>
<body>
<div class="sh-stage" id="stage">
  <!-- полный экран окну разрешён: без allow браузер отвечает fullscreenEnabled = false,
       и продукт прячет «На весь экран» с плитки и из меню участника
       (ParticipantInfo.tsx:553, ParticipantPanelActions.tsx:775) -->
  <div class="sh-frame" id="frame"><iframe id="window" title="Окно звонка" allow="fullscreen"></iframe></div>
</div>
<aside class="sh-panel sh-panel-slim" id="panel" aria-label="Настройки сценария"></aside>

<script>
// Оболочка прототипа: помощники для shell.js.
// Размер окна продукта выбирается независимо от постоянно видимой панели.
const рамка = document.getElementById('frame');
let окно = document.getElementById('window');
const панель = document.getElementById('panel');
const место = document.getElementById('stage');
const РАЗМЕРЫ = [
  { id: 'desktop', имя: 'Компьютер', подпись: 'монитор', ширина: 1600, высота: 900 },
  { id: 'tablet', имя: 'Планшет', подпись: 'планшет', ширина: 768, высота: 1024 },
  { id: 'phone', имя: 'Телефон', подпись: 'телефон', ширина: 390, высота: 844 },
  { id: 'custom', имя: 'Свой', ширина: 1600, высота: 900 },
];
let размерОкна = 0;
const свойРазмер = { ширина: '', высота: '' };
const размерДоВвода = { ширина: РАЗМЕРЫ[0].ширина, высота: РАЗМЕРЫ[0].высота };

function корректныйРазмер(значение) {
  return значение === '' || (/^\d+$/.test(значение) && Number(значение) > 0 && Number(значение) <= 16384);
}

/** Фрейм получает выбранный viewport, масштаб меняет только показ макета. */
function вписать() {
  const размер = РАЗМЕРЫ[размерОкна];
  const зазор = parseFloat(getComputedStyle(document.body).columnGap);
  const доступнаяШирина = document.body.clientWidth - панель.offsetWidth - зазор;
  const k = Math.max(0, Math.min(1, доступнаяШирина / размер.ширина, место.clientHeight / размер.высота));
  рамка.style.width = размер.ширина * k + 'px';
  рамка.style.height = размер.высота * k + 'px';
  for (const кадр of рамка.querySelectorAll('iframe')) {
    кадр.style.width = размер.ширина + 'px';
    кадр.style.height = размер.высота + 'px';
    кадр.style.transform = 'scale(' + k + ')';
    if (кадр.dataset.device !== размер.id) {
      кадр.dataset.device = размер.id;
      // Same-origin preview changes capabilities in place, preserving the call.
      кадр.contentWindow?.dispatchEvent(new Event('prototype-device-change'));
    }
  }
}

new ResizeObserver(вписать).observe(document.documentElement);

function эл(тег, класс, текст) {
  const e = document.createElement(тег);
  if (класс) e.className = класс;
  if (текст !== undefined) e.textContent = текст;
  return e;
}

/**
 * Заполнение окна — сколько людей зову, как принято у макетов (решение
 * владельца, 18 сентября 2026). Пустое — 1 на 1. Числа — у плеера
 * (`player.tsx`, `ЗОВУ`); здесь пункты и их имена в адресе окна.
 */
const ЗАПОЛНЕНИЕ = [
  ['Пустое представление', ''],
  ['Типовое', 'typical'],
  ['Максимальное', 'max'],
];

const МОНИТОР =
  '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="2" y="2.5" width="12" height="8.5" rx="1.5"/><path d="M8 11v2.5M5.5 13.5h5"/></svg>';

const ИКОНКИ_УСТРОЙСТВ = [
  МОНИТОР,
  '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="1.5" width="11" height="13" rx="1.5"/><path d="M7 12h2"/></svg>',
  '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><rect x="4" y="1.5" width="8" height="13" rx="1.5"/><path d="M7 12h2"/></svg>',
];

/**
 * Выпадающий список — тот же уровень фильтра, что `фильтр`, когда пунктов
 * много: выбор сценария. Список настоящий, браузерный: клавиатура и чтение
 * экраном работают как у любого `<select>`.
 */
function выпадающий(заголовок, имя, пункты, выбран, выбрать) {
  const блок = эл('section', 'sh-filter');
  блок.append(эл('h2', 'sh-filter-title', заголовок));
  const обёртка = эл('div', 'sh-filter-list');
  const стрелка = эл('label', 'sh-select');
  const выбор = эл('select');
  выбор.name = имя;
  выбор.setAttribute('aria-label', заголовок);
  пункты.forEach((текст, i) => выбор.append(new Option(текст, String(i), false, i === выбран)));
  выбор.addEventListener('change', () => выбрать(Number(выбор.value)));
  стрелка.append(выбор);
  обёртка.append(стрелка);
  блок.append(обёртка);
  return блок;
}

/** Блок панели с текстом вместо переключателей: у черновика шагов ещё нет. */
function заметка(заголовок, строки) {
  const блок = эл('section', 'sh-filter');
  блок.append(эл('h2', 'sh-filter-title', заголовок));
  const список = эл('div', 'sh-filter-list');
  строки.forEach((с) => список.append(эл('p', 'sh-note', с)));
  блок.append(список);
  return блок;
}

/** Размер окна звонка: выбор сохраняется при смене сценария. */
function шапкаУстройства() {
  const устройство = эл('div', 'sh-device');
  const ряд = эл('div', 'sh-device-row');
  ряд.setAttribute('role', 'group');
  ряд.setAttribute('aria-label', 'Размер окна звонка');
  [2, 1, 0, 3].forEach((i) => {
    const размер = РАЗМЕРЫ[i];
    const чип = эл('button', 'sh-size-chip' + (размер.id === 'custom' ? ' sh-size-chip-custom' : ''));
    чип.type = 'button';
    чип.name = 'size';
    чип.value = String(i);
    чип.title = размер.имя;
    чип.setAttribute('aria-label', размер.имя);
    чип.setAttribute('aria-pressed', String(i === размерОкна));
    if (размер.id === 'custom') чип.textContent = размер.имя;
    else чип.innerHTML = ИКОНКИ_УСТРОЙСТВ[i];
    чип.addEventListener('click', () => {
      if (размер.id === 'custom' && размерОкна !== i) {
        const текущий = РАЗМЕРЫ[размерОкна];
        ['ширина', 'высота'].forEach((ось) => {
          размер[ось] = размерДоВвода[ось] = текущий[ось];
          свойРазмер[ось] = '';
        });
      }
      размерОкна = i;
      вписать();
      запомнить();
      нарисовать();
    });
    ряд.append(чип);
  });
  const размер = РАЗМЕРЫ[размерОкна];
  устройство.append(ряд);
  if (размер.id === 'custom') {
    const поля = эл('div', 'sh-custom-size');
    const ошибка = эл('div', 'sh-size-error', 'Введите целые размеры от 1 до 16384 пикселей.');
    ошибка.id = 'size-error';
    ошибка.setAttribute('role', 'status');
    ошибка.hidden = Object.values(свойРазмер).every(корректныйРазмер);
    ['ширина', 'высота'].forEach((ось, i) => {
      if (i) поля.append(эл('span', '', '×'));
      const поле = эл('input', 'sh-size-input');
      Object.assign(поле, { type: 'text', inputMode: 'numeric', name: 'size-' + ось,
        value: свойРазмер[ось], placeholder: String(размерДоВвода[ось]), autocomplete: 'off' });
      поле.setAttribute('aria-label', i ? 'Высота окна' : 'Ширина окна');
      поле.setAttribute('aria-describedby', ошибка.id);
      поле.setAttribute('aria-invalid', String(!корректныйРазмер(свойРазмер[ось])));
      поле.addEventListener('input', () => {
        свойРазмер[ось] = поле.value;
        поле.setAttribute('aria-invalid', String(!корректныйРазмер(поле.value)));
        ошибка.hidden = Object.values(свойРазмер).every(корректныйРазмер);
        if (!ошибка.hidden) return;
        размер.ширина = Number(свойРазмер.ширина || размерДоВвода.ширина);
        размер.высота = Number(свойРазмер.высота || размерДоВвода.высота);
        вписать();
        запомнить();
      });
      поля.append(поле);
    });
    поля.append(эл('span', '', 'пикс.'));
    устройство.append(поля, ошибка);
  } else {
    устройство.append(эл('div', 'sh-device-size', размер.ширина + '×' + размер.высота + ' ' + размер.подпись));
  }
  return устройство;
}

/** Фильтр: заголовок и переключатели. Выбрать можно и выбранный — начать заново. */
function фильтр(заголовок, имя, пункты, выбран, выбрать, заблокирован = false) {
  const блок = эл('section', 'sh-filter');
  блок.append(эл('h2', 'sh-filter-title', заголовок));
  const список = эл('div', 'sh-filter-list');
  список.setAttribute('role', 'radiogroup');
  список.setAttribute('aria-label', заголовок);
  пункты.forEach((текст, i) => {
    const пункт = эл('label', 'sh-radio');
    const радио = эл('input');
    Object.assign(радио, { type: 'radio', name: имя, value: String(i), checked: i === выбран, disabled: заблокирован });
    радио.addEventListener('click', () => выбрать(i));
    пункт.append(радио, эл('span', '', текст));
    список.append(пункт);
  });
  блок.append(список);
  return блок;
}

// Keep the displayed document until its replacement has rendered the target.
let подготовка = null;
let таймерПодготовки = 0;
let ошибкаПерехода = null;

function отменитьПодготовку() {
  clearTimeout(таймерПодготовки);
  подготовка?.remove();
  подготовка = null;
  ошибкаПерехода?.remove();
  ошибкаПерехода = null;
  рамка.removeAttribute('aria-busy');
  окно.inert = false;
}

function показатьПодготовленное(следующее) {
  if (подготовка !== следующее) return;
  clearTimeout(таймерПодготовки);
  const прежнее = окно;
  прежнее.removeAttribute('id');
  следующее.id = 'window';
  следующее.classList.remove('sh-preparing-frame');
  следующее.removeAttribute('aria-hidden');
  следующее.removeAttribute('tabindex');
  следующее.inert = false;
  окно = следующее;
  подготовка = null;
  прежнее.remove();
  рамка.removeAttribute('aria-busy');
}

function подготовитьОкно(адрес, html = false) {
  отменитьПодготовку();
  // Initial loading keeps Storybook's own loader; there is no previous view yet.
  if (!окно.getAttribute('src') && !окно.getAttribute('srcdoc')) {
    if (html) окно.srcdoc = адрес;
    else окно.src = адрес;
    return;
  }
  const следующее = document.createElement('iframe');
  следующее.id = 'window-next';
  следующее.title = окно.title || 'Окно звонка';
  следующее.setAttribute('allow', окно.getAttribute('allow') || 'fullscreen');
  следующее.className = 'sh-preparing-frame';
  следующее.setAttribute('aria-hidden', 'true');
  следующее.setAttribute('tabindex', '-1');
  следующее.inert = true;
  подготовка = следующее;
  рамка.append(следующее);
  вписать(); // Device profile and native viewport must exist before loading.
  рамка.setAttribute('aria-busy', 'true');
  окно.inert = true;
  таймерПодготовки = setTimeout(() => {
    if (подготовка !== следующее) return;
    отменитьПодготовку();
    ошибкаПерехода = эл('div', 'sh-transition-error', 'Не удалось открыть выбранное состояние. ');
    ошибкаПерехода.setAttribute('role', 'status');
    const повтор = эл('button', '', 'Повторить');
    повтор.type = 'button';
    повтор.onclick = () => подготовитьОкно(адрес, html);
    ошибкаПерехода.append(повтор);
    рамка.append(ошибкаПерехода);
  }, 30000);
  if (html) {
    следующее.onload = () => показатьПодготовленное(следующее);
    следующее.srcdoc = адрес;
  } else следующее.src = адрес;
}

window.addEventListener('message', (event) => {
  if (event.origin !== location.origin || !подготовка || event.source !== подготовка.contentWindow) return;
  if (event.data?.type === 'prototype-frame-ready') показатьПодготовленное(подготовка);
});

// Оболочка прототипа: окно звонка и общая панель. Шаблон — shell.html.
//
// Панель — дерево всего прототипа (`ПРОТОТИП`): пользователь, сценарий,
// условия, шаги. Готовые сценарии встают в дерево из своих же данных
// (`gen_scenarios.py` подставляет их сюда) и ведут окно: лист — вариант,
// шаг — адрес окна. Лист, которого ещё нет в сценариях, — черновик: окно
// пустое, в панели заметка. Правила сборки — `panel-rules.md`.

/**
 * Вариант по ключу — с его сценарием: окно открывает адрес сценария. Ключ —
 * история окна и id варианта: id повторяются от сценария к сценарию
 * (`first` у H1, H2 и H4), а один сценарий играют двое (A19 и HA19).
 */
const ВАРИАНТЫ = new Map();
/** Полный путь варианта в дереве: путь сценария и его `выбор`. */
const ПУТИ = new Map();

/** Ключ варианта: история окна и id — `scenarios--h-1:first`. */
const ключ = (окно, id) => new URLSearchParams(окно.split('?')[1]).get('id') + ':' + id;

/**
 * Дерево готового сценария из его вариантов: путь `выбор`, шаги, названия
 * уровней. Лист несёт первый вариант ветки. Ветку без своего пункта
 * открывает нажатие в окне: её путь короче или такой же, как у соседа,
 * и панель узнаёт её по варианту в окне (`уровни`).
 */
function деревоСценария(с, начало) {
  с.варианты.forEach((в) => {
    const к = ключ(с.окно, в.id);
    ВАРИАНТЫ.set(к, { ...в, окно: с.окно, ключ: к, фиксированноеЗаполнение: с.фиксированноеЗаполнение });
    ПУТИ.set(к, [...начало, ...в.выбор]);
  });
  const свой = (в) => ВАРИАНТЫ.get(ключ(с.окно, в.id));
  const ветвь = (путь) => {
    const свои = с.варианты.filter((в) => путь.every((п, i) => в.выбор[i] === п));
    const глубже = свои.filter((в) => в.выбор.length > путь.length);
    if (!глубже.length) return { вариант: свой(свои[0]), шаги: свои[0].шаги.map((ш) => ш.название) };
    const пункты = [...new Set(глубже.map((в) => в.выбор[путь.length]))];
    // ветка без нажатий короче соседей: своего пункта у неё нет, но открывается
    // она — по умолчанию (`panel-rules.md`, «Кто решает развилку»)
    const сама = свои.find((в) => в.поУмолчанию && в.выбор.length === путь.length);
    return {
      заголовок: с.фильтры[путь.join(' / ')] ?? '',
      пункты: пункты.map((имя) => ({ имя, ...ветвь([...путь, имя]) })),
      ...(сама ? { вариант: свой(сама) } : {}),
    };
  };
  return { имя: с.название, ...ветвь([]) };
}

/** Узел с развилкой: пункт, вопрос уровня ниже, ответы. */
const развилка = (имя, заголовок, пункты) => ({ имя, заголовок, пункты });

/**
 * Развилка, чей уровень — выпадающий список, а не переключатели: выбор
 * сценария (решение владельца, 18 сентября 2026). Сценариев много, и их
 * станет больше, а переключатели растянули бы панель.
 */
const списком = (имя, заголовок, пункты) => ({ ...развилка(имя, заголовок, пункты), вид: 'список' });

/**
 * Лист черновика. `путь` — путь свимлейна (`ia/render/sw_data_*.py`), откуда
 * взят исход. `поНажатию` — ветки, которые выбирает моё нажатие в окне:
 * пунктами панели они не становятся. По умолчанию — ветка без нажатий
 * (`безНажатия`), а если её нет — первая. Шагов у листа черновика нет:
 * они появятся, когда натянем сценарий.
 */
const исход = (имя, путь, поНажатию, безНажатия) => ({ имя, путь, поНажатию, безНажатия });

/**
 * Готовый сценарий: его дерево строится из его же данных. `черновики` —
 * пункты первого уровня, которых в сценарии ещё нет: встают следом за его
 * пунктами, окно у них пустое.
 */
const сценарий = (ид, ...черновики) => ({ сценарий: ид, черновики });

/**
 * Доп. сценарии — состояния, которые в звонке наводят не мои нажатия и не
 * ветка сценария: устройства, связь. Пункт списка сценариев: выбран — ниже
 * только его уровни и шаги, от других сценариев ничего (решение владельца,
 * 18 сентября 2026). Они одни у обоих пользователей: у гостя это те же
 * сценарии, сыгранные гостем, — HA19 и HA10 (`схема` в сценарии).
 */
const ДОП_СЦЕНАРИИ = развилка('Доп. сценарии', 'Доп. сценарий', [сценарий('A19'), сценарий('A10')]);
const ДОП_СЦЕНАРИИ_ГОСТЯ = развилка('Доп. сценарии', 'Доп. сценарий', [сценарий('HA19'), сценарий('HA10')]);

/**
 * Дерево всего прототипа (18 сентября 2026). Первый уровень — пользователь
 * (решение владельца), дальше по свимлейну. Развилку, которую решают
 * другие, держит фильтр; развилку, которую решаю я нажатием в окне, —
 * `поНажатию` (`panel-rules.md`, «Кто решает развилку»).
 */
const ПРОТОТИП = развилка('', 'Пользователь', [
  списком('Авторизованный', 'Сценарий', [
    сценарий('A1'),
    сценарий('A2'),
    развилка('Совещание', 'Вход в совещание', [
      сценарий('A3'),
      сценарий('A3b'),
      сценарий('A3c'),
      // блокирует ведущий — это совещание (решение владельца, 18 сентября 2026)
      развилка('Ведущий заблокировал', 'Что заблокировано', [сценарий('A15'), сценарий('A16')]),
    ]),
    // Четыре стороны слияния; конфликт второго окна пока скрыт
    // (решение владельца, 06.10.2026).
    сценарий('AC'),
    сценарий('P'),
    сценарий('A6'),
    ДОП_СЦЕНАРИИ,
  ]),
  списком('Гость', 'Сценарий', [
    сценарий('H1'),
    сценарий('H2'),
    сценарий('H4'),
    сценарий('H3'),
    сценарий('HP'),
    ДОП_СЦЕНАРИИ_ГОСТЯ,
  ]),
]);

/** Подставить готовые сценарии в черновик; путь — чтобы знать, где лежит вариант. */
function собрать(узел, путь = []) {
  if (узел.сценарий) {
    const с = ДАННЫЕ.сценарии.find((x) => x.ид === узел.сценарий);
    const дерево = деревоСценария(с, [...путь, с.название]);
    if (узел.черновики.length) дерево.пункты.push(...узел.черновики);
    return дерево;
  }
  if (!узел.пункты) return узел;
  return { ...узел, пункты: узел.пункты.map((x) => собрать(x, узел.имя ? [...путь, узел.имя] : путь)) };
}

const ДЕРЕВО = собрать(ПРОТОТИП);

// Выбор живёт в адресе оболочки: перезагрузка открывает то же место.
// `путь` — по дереву; `вариант` — вариант готового сценария, который играет
// окно, или `null` у черновика; `ход` — ход окна, как его пишет плеер;
// `ждём` — окно ещё грузит открытый вариант, в его адресе прежний.
const выбор = { заполнение: 0, путь: [], вариант: null, ход: 0, ждём: false };

/** Дойти по пути до листа: недостающее и неверное — первым пунктом. */
function достроить(путь, корень = ДЕРЕВО) {
  const out = [];
  let узел = корень;
  for (let у = 0; узел.пункты; у++) {
    // путь кончился у развилки со своей веткой без нажатий — она и открыта
    if (узел.вариант && путь[у] === undefined) break;
    узел = узел.пункты.find((x) => x.имя === путь[у]) || узел.пункты[0];
    out.push(узел.имя);
  }
  return out;
}

/** Узел по пути: развилка, у которой путь кончился, или лист. */
function узелПоПути(путь) {
  let узел = ДЕРЕВО;
  for (const имя of путь) узел = узел.пункты.find((x) => x.имя === имя);
  return узел;
}

/** Ход окна для шага: первый ход шага и итоговые следом — окно таким, каким стало к концу шага. */
function входВШаг(в, шаг) {
  return в.шаги[шаг].вход;
}

/** Шаг на экране — тот, где лежит последний сделанный ход. */
function шагОкна(в, ход) {
  let шаг = 0;
  в.шаги.forEach((ш, i) => {
    if (ш.ход <= ход - 1) шаг = i;
  });
  return шаг;
}

function запомнить() {
  const заполнение = ЗАПОЛНЕНИЕ[выбор.заполнение][1];
  history.replaceState(
    null,
    '',
    '#p=' +
      encodeURIComponent(выбор.путь.join('/')) +
      (выбор.вариант ? '&v=' + выбор.вариант : '') +
      '&step=' +
      выбор.ход +
      (заполнение ? '&fill=' + заполнение : '') +
      (размерОкна ? '&size=' + РАЗМЕРЫ[размерОкна].id : '') +
      (РАЗМЕРЫ[размерОкна].id === 'custom'
        ? '&width=' + РАЗМЕРЫ[размерОкна].ширина + '&height=' + РАЗМЕРЫ[размерОкна].высота
        : '')
  );
}

/** Подготовить вариант с хода, сохраняя прежний кадр до готовности нового. */
function открыть(в, ход) {
  Object.assign(выбор, { путь: ПУТИ.get(в.ключ), вариант: в.ключ, ход, ждём: true });
  if (в.фиксированноеЗаполнение) выбор.заполнение = ЗАПОЛНЕНИЕ.findIndex((x) => x[1] === в.фиксированноеЗаполнение);
  const заполнение = ЗАПОЛНЕНИЕ[выбор.заполнение][1];
  // параметр без кодирования: плеер читает `variant:x;step:n;fill:f` как есть
  подготовитьОкно(в.окно + '&args=variant:' + в.id + ';step:' + ход + (заполнение ? ';fill:' + заполнение : ''));
  запомнить();
  нарисовать();
}

/** Лист черновика: сценария ещё нет, окно пустое с подписью. */
function открытьЧерновик(путь) {
  Object.assign(выбор, { путь, вариант: null, ход: 0, ждём: false });
  подготовитьОкно(
    '<body style="margin:0;height:100vh;display:grid;place-items:center;background:#202327;' +
    'color:#8e98ad;font:28px/1.4 Inter,system-ui,sans-serif">' +
    'Этот сценарий ещё не собран: окно появится, когда натянем его.</body>', true);
  запомнить();
  нарисовать();
}

/** Выбрали пункт уровня: путь до первого листа, лист — вариант или черновик. */
function выбрать(путь) {
  const лист = узелПоПути(путь);
  if (лист.вариант) открыть(лист.вариант, входВШаг(лист.вариант, 0));
  else открытьЧерновик(путь);
}

/** Ход и ветка, где стоит окно: плеер пишет их в свой адрес. */
function следить() {
  if (подготовка || ошибкаПерехода) {
    setTimeout(следить, 300);
    return;
  }
  try {
    const адрес = new URLSearchParams(окно.contentWindow.location.search);
    const args = адрес.get('args') || '';
    const п = Object.fromEntries(args.split(';').map((x) => x.split(':')));
    const ход = Number(п.step) || 0;
    const к = адрес.get('id') + ':' + п.variant;
    if (выбор.вариант && к === выбор.вариант) {
      выбор.ждём = false;
      if (ход !== выбор.ход) {
        выбор.ход = ход;
        запомнить();
        нарисовать();
      }
    } else if (выбор.вариант && !выбор.ждём && ВАРИАНТЫ.has(к)) {
      // Окно ушло в соседнюю ветку моим нажатием в нём: панель встаёт на неё,
      // окно не перезагружается.
      Object.assign(выбор, { путь: ПУТИ.get(к), вариант: к, ход });
      запомнить();
      нарисовать();
    }
  } catch (_) {
    // окно ещё грузится
  }
  setTimeout(следить, 300);
}

/**
 * Уровни дерева по пути: на уровень — группа переключателей или выпадающий
 * список, если так помечена развилка. Спуск кончается листом или там, где
 * кончился путь варианта в окне: ветка без своего пункта. Возвращает, что
 * внизу: вариант готового сценария или лист черновика.
 */
function уровни(фильтры) {
  const вОкне = ВАРИАНТЫ.get(выбор.вариант);
  let узел = ДЕРЕВО;
  for (let у = 0; узел.пункты; у++) {
    if (вОкне && ПУТИ.get(вОкне.ключ).length === у) return вОкне;
    // свои на каждый уровень: цикл дальше переписывает `узел`
    const уровень = у;
    const список = узел.пункты;
    const выбранный = список.findIndex((x) => x.имя === выбор.путь[у]);
    const группа = узел.вид === 'список' ? выпадающий : фильтр;
    фильтры.append(
      группа(узел.заголовок, 'level' + у, список.map((x) => x.имя), выбранный, (i) =>
        выбрать(достроить([...выбор.путь.slice(0, уровень), список[i].имя]))
      )
    );
    узел = список[выбранный];
  }
  return вОкне ?? узел;
}

function нарисовать() {
  const активный = document.activeElement;
  const фокус = панель.contains(активный) && активный.name
    ? { имя: активный.name, значение: активный.value, начало: активный.selectionStart, конец: активный.selectionEnd }
    : null;
  панель.replaceChildren();
  const фильтры = эл('div', 'sh-filters');
  const фиксированное = !!ВАРИАНТЫ.get(выбор.вариант)?.фиксированноеЗаполнение;
  // Заполнение — настройка показа, не ветка: держится при смене сценария
  // и ветки, смена переоткрывает окно с начала того же шага
  // (`panel-rules.md`, «Заполнение окна»).
  фильтры.append(
    фильтр('Заполнение', 'fill', фиксированное ? ['Типовое'] : ЗАПОЛНЕНИЕ.map((x) => x[0]), фиксированное ? 0 : выбор.заполнение, (i) => {
      выбор.заполнение = i;
      const в = ВАРИАНТЫ.get(выбор.вариант);
      if (в) открыть(в, входВШаг(в, шагОкна(в, выбор.ход)));
      else {
        запомнить();
        нарисовать();
      }
    }, фиксированное)
  );
  const низ = уровни(фильтры);
  фильтры.append(
    низ.шаги && низ.id
      ? фильтр('Шаги сценария', 'step', низ.шаги.map((x) => x.название), шагОкна(низ, выбор.ход), (i) =>
          открыть(низ, входВШаг(низ, i))
        )
      : заметка('Шаги сценария', [
          'Появятся, когда натянем сценарий.',
          ...(низ.безНажатия ? ['Если ничего не нажимать — ' + низ.безНажатия + '.'] : []),
          ...(низ.поНажатию
            ? [
                'Ветку выбирает нажатие в окне: ' +
                  низ.поНажатию.join(' · ') +
                  (низ.безНажатия ? '.' : '. По умолчанию — ' + низ.поНажатию[0] + '.'),
              ]
            : []),
        ])
  );
  панель.append(шапкаУстройства(), фильтры);
  if (фокус) {
    const контроль = [...панель.querySelectorAll('input, select, button')].find(
      (e) => e.name === фокус.имя && e.value === фокус.значение
    );
    контроль?.focus({ preventScroll: true });
    if (контроль && typeof фокус.начало === 'number') контроль.setSelectionRange(фокус.начало, фокус.конец);
  }
}

window.addEventListener('resize', вписать);
const п = new URLSearchParams(location.hash.slice(1));
выбор.заполнение = Math.max(0, ЗАПОЛНЕНИЕ.findIndex((x) => x[1] === (п.get('fill') || '')));
размерОкна = Math.max(0, РАЗМЕРЫ.findIndex((x) => x.id === п.get('size')));
if (РАЗМЕРЫ[размерОкна].id === 'custom') {

      размерДоВвода[ось] = Number(значение);
      if (Number(значение) !== РАЗМЕРЫ[0][ось]) свойРазмер[ось] = значение;
    }
  });
}
вписать();
{
  // Вариант в окне записан в адресе (`v`): так открывается и ветка без
  // своего пункта. Нет его — путь до листа.
  const путь = (п.get('p') || '').split('/');
  const в = ВАРИАНТЫ.get(п.get('v')) ?? узелПоПути(достроить(путь)).вариант;
  if (в) открыть(в, Math.min(Number(п.get('step')) || входВШаг(в, 0), в.ходов + 1));
  else открытьЧерновик(достроить(путь));
}
следить();
